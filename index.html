      kundan arabcha gapira boshlaysiz.</p>
    <h2>Darajalar</h2>
    <ul>
      <li>A1 — Boshlang‘ich: harflar, salomlashish, oddiy jumlalar</li>

      <li>B2 — O‘rtadan yuqori: erkin suhbat va matn tahlili</li>
      <li>C1 — Yuqori: ilmiy matn, nozik ma’no farqlari</li>
      <li>C2 — Mukammal: adabiy matn, balog‘at va sarf-nahv</li>
    </ul>
    <h2>Markaz haqida</h2>
    <ul>

      <li>Kichik guruhlar — har bir o‘quvchiga shaxsiy e’tibor</li>

      <li>Bepul daraja aniqlash testi — 20 ta savol, 10 daqiqa</li>
